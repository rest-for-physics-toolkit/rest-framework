# Geant4 -> drifted hits pipeline: TRestGeant4Event (restG4 output file) -> TRestDetectorHitsEvent with the
# ionization electrons diffused to the AlphaCAMM readout: hitsDrift collects them on the readout plane at
# their arrival time, timeProjection gives them back their z from the time (drift velocity of the
# medium).
#   restManager --c libraries/connectors/examples/Geant4ToDriftHits.yaml --i <restG4 output file>
# The readout is AlphaCAMM.root of rest-common-readouts (by URL; plane at z = 0, normal [0, 0, 1], gasThickness 90 mm),
# with the geometry of the simulation (readout at z = 0, cathode at z = 90 mm, so that z is the drift distance
# as reconstructed by TRestDetectorHitsTimeProjectionProcess).
# The transport parameters can be read instead from the medium file (see the commented medium), e.g.
# ArIso.root of rest-common-transport.
# Optional processes (commented): hitsTransformation, for a simulation in another frame (e.g. the lab frame,
# with the drift along -Z), and avalanche, the gain of the amplification gap (Polya fluctuations) from the
# gain table of the medium file. rest-common-transport v1.0 has no gain tables: generate them with
#   restGarfield packages/restGarfield/examples/ArIso.yaml   (its `gain` section uncommented)
# and set `mediumFile: "ArIso.root"` in the medium. driftResponse replaces hitsDrift in a non-uniform field:
# the drift response of a CST field map computed by the same command (its `drift` section uncommented).

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    inheritInputRun: true
    runUser: "${ENV:USER}"
    runDescription: "Geant4ToDriftHits"
    inputFileName: ""
    outputFileName: "Run[runNumber]_[runTag]_[experimentName]_DRIFT.root"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/AlphaCAMM.root"
        instanceName: "AlphaCAMM_Readout"
        decodingName: "nominal_decoding"

  medium:
    class: "TRestDetectorMedium"
    name: "ArIso"
    pressure: 1 bar
    charge:
      wValue: 26.2 eV
      fanoFactor: 0.2
      driftField: 100 V/cm   # where the transport tables are evaluated (with a mediumFile)
      # Fixed transport (no mediumFile)
      driftVelocity: 11.5 mm/us
      longDiff: 0.03
      transDiff: 0.03
      attachment: 0
#    mediumFile: "ArIso.root"   # with the gain table of restGarfield, for avalanche

#  medium:
#    class: "TRestDetectorMedium"
#    name: "Ar99_iC4H10_1"
#    mediumFile: "https://github.com/rest-for-physics-toolkit/rest-common-transport/releases/download/v1.0/ArIso.root"   # tables at pressure and temperature, chosen by the field
#    pressure: 1 bar
#    charge:
#      wValue: 26.2 eV
#      fanoFactor: 0.2
#      driftField: 100 V/cm

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true
    geant4ToHits:
      class: "TRestGeant4ToDetectorHitsProcess"
#    hitsTransformation:   # simulation in the lab frame (drift along -Z): to the frame of the readout
#      class: "TRestDetectorHitsTransformationProcess"
#      mirrorPosition: [0, 0, 0]
#      mirrorNormal: [0, 0, 1]
    hitsDrift:
      class: "TRestDetectorHitsDriftProcess"
      fluctuations: "fano"
      maxHits: 1000
#    driftResponse:        # instead of hitsDrift: drift in a CST field map (restGarfield `drift` section)
#      class: "TRestDetectorHitsDriftResponseProcess"
#      responseFile: "ArIso_drift.root"
#      fluctuations: "fano"
#      maxHits: 1000
#      seed: 1
#    avalanche:            # gain of the 50 um gap at 300 V (6 kV/mm), from the gain table of the medium
#      class: "TRestDetectorAvalancheProcess"
#      amplificationVoltage: 300 V
#      gap: 50 um
#      seed: 1
    timeProjection:
      class: "TRestDetectorHitsTimeProjectionProcess"
