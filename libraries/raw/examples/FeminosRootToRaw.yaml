# Reads a ROOT file of feminos-daq (run number, tag, description, start time and runInfo from its run tree)
# of TREX-DM and runs the chain of one Micromegas plane to tracks, as examples/TREXDMToTracks.yaml for the
# files of the FEMDAQ: raw signals of the DAQ channels of the plane, raw signal analysis, detector signals,
# hits and track analysis:
#   restManager --c libraries/raw/examples/FeminosRootToRaw.yaml --i R03137_....root --set plane=0
# and the same with --set plane=1 for the other plane (output FeminosRoot_Plane<plane>.root).
# The readout is TREXDM.root of rest-common-readouts (plane 0: DAQ channels 2-573, plane 1: 578-1149), the
# gas that of examples/TREXDMToTracks.yaml (Ne + 2% isobutane at 2 bar, NeIso.root of rest-common-transport;
# only the drift velocity of the hits): adjust it to the run.

parameters:
  plane: 0  # Micromegas plane: 0 (z = 160.4 mm) or 1 (z = -160.4 mm)

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    runUser: "${ENV:USER}"
    inputFileName: ""
    # Resolved before the process reads the run of the DAQ file: [runNumber] or [runTag] here would be the
    # ones of the configuration (or of inputFormat), not the ones of the DAQ
    outputFileName: "FeminosRoot_Plane${PARAM:plane}.root"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readout: "TREXDM_Plane${PARAM:plane}_Readout"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/TREXDM.root"
        instanceName: "TREXDM_Plane0_Readout"
        decodingName: "nominal_decoding"
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/TREXDM.root"
        instanceName: "TREXDM_Plane1_Readout"
        decodingName: "nominal_decoding"

  # The drift velocity of the hits (timeProjection)
  medium:
    class: "TRestDetectorMedium"
    name: "Ne98_iC4H10_2"
    mediumFile: "https://github.com/rest-for-physics-toolkit/rest-common-transport/releases/download/v1.0/NeIso.root"
    pressure: 2 bar
    temperature: 293.15
    charge:
      wValue: 36.6 eV  # neon (not used by the data chain)
      fanoFactor: 0.2
      driftField: 300 V/cm  # 150 V/cm/bar at 2 bar

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true

    feminosRootToSignal:
      class: "TRestRawFeminosRootToSignalProcess"
      name: "feminosRootToSignal"
      useFeminosDaqRunInfo: true

    # The DAQ channels of the plane
    planeChannels:
      class: "TRestRawSignalChannelSelectionProcess"
      keepChannelRange:
        select: "${PARAM:plane}"
        cases:
          0: [[2, 573]]
          1: [[578, 1149]]

    rawAna:
      class: "TRestRawSignalAnalysisProcess"
      baselineRange: [20, 140]
      integralRange: [150, 450]
      pointsThreshold: 3
      signalThreshold: 7
      pointsOverThreshold: 7
      observables:
        - "all"

    rawToSignal:
      class: "TRestRawToDetectorSignalProcess"
      sampling: 40 ns
      triggerStarts: 0
      gain: 1
      zeroSuppression: true
      baselineRange: [20, 140]
      integralRange: [150, 450]
      pointsThreshold: 3
      signalThreshold: 7
      pointsOverThreshold: 7
      observables:
        - "all"

    signalToHits:
      class: "TRestDetectorSignalToHitsProcess"
      method: "gaussFit"
    # Drift coordinate from the time, with the drift velocity of the medium at the drift field
    timeProjection:
      class: "TRestDetectorHitsTimeProjectionProcess"

    hitsToTrack:
      class: "TRestDetectorHitsToTrackProcess"
      clusterDistance: "3mm"
      attachEnergy: 500
      attachDistance: [3mm, 3mm, 4mm]

    trackAnalysis:
      class: "TRestTrackAnalysisProcess"
      cutsEnabled: true
      projections: ["XZ", "YZ"]
      nTracksCut: [1, 10]
      gaussFit: true
      observables:
        - "all"
