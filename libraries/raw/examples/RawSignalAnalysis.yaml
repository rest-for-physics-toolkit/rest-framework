# Raw signal analysis (TRestRawSignalAnalysisProcess, all its observables) of a file with TRestRawSignalEvent,
# keeping the run of the input file (inheritInputRun):
#   restManager --c libraries/raw/examples/RawSignalAnalysis.yaml --i <file with TRestRawSignalEvent>
# Optional processes before the analysis (commented, they change the signals): zsToRaw for zero-suppressed
# data (the first sample sent of each signal taken as its offset) and shaping, to emulate the shaping of
# other electronics.

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    inheritInputRun: true
    runUser: "${ENV:USER}"
    inputFileName: ""
    outputFileName: "R[runNumber]_[subRunNumber]_[runTag]_[runDescription]_[runType]_RAWANA.root"
    entriesSaved: 0

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    verbose: "silent"
    eventsToProcess: 0
    outputEventStorage: true
#    zsToRaw:
#      class: "TRestRawZeroSupressionToRawProcess"
#    shaping:
#      class: "TRestRawSignalShapingProcess"
#      shapingType: "shaperSin"   # gaus, exponential, shaper or shaperSin
#      shapingTime: 10            # bins
#      gain: 1
#      baselineRange: [5, 55]
    rawAna:
      class: "TRestRawSignalAnalysisProcess"
      name: "rawAna"
      observables:
        - "all"
