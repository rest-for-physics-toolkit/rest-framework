# Signal selection (TRestDataSetSignalSelection) of datasets processed with DataSetTMVA.yaml: the range of the
# BDT score holding the 80% of the calibration with the highest scores (quantiles [0.2, 1], with the cuts on
# the calibrated energy and the fiducial region) is computed, and only the entries of the dataset processed
# that pass the same cuts (applyCuts) and are in that range are kept:
#   restManager --c examples/DataSetSignalSelection.yaml --i Dataset_Background_TMVA.root
# (output Dataset_Background_Selected.root, from the tag of inputFormat; the entries kept in each run are its
# selectedEntries). The reference is the calibration processed by DataSetTMVA.yaml
# (restManager --c examples/DataSetTMVA.yaml --i Dataset_Calibration_Calibrated.root).
# The same selection with the log odds of DataSetLogOdds.yaml: DataSetLogOddsSelection.yaml.

manager:
  class: "TRestManager"
  name: "manager"

  energy:
    class: "TRestCut"
    conditions:
      range: "calib_Energy > 4 && calib_Energy < 8"

  # The fiducial region: the main track within 1 cm of the centre of the readout
  fiducial:
    class: "TRestCut"
    conditions:
      inside: "trackAnalysis_MaxTrack_XZ_MeanX * trackAnalysis_MaxTrack_XZ_MeanX +
               trackAnalysis_MaxTrack_YZ_MeanY * trackAnalysis_MaxTrack_YZ_MeanY < 100"

  dataSetProcessing:
    class: "TRestDataSetProcessManager"
    inputFileName: "Dataset_Background_TMVA.root"  # --i
    inputFormat: "Dataset_[sample]_TMVA.root"
    outputFileName: "Dataset_[sample]_Selected.root"  # --o

    bdtSelection:
      class: "TRestDataSetSignalSelection"
      referenceFileName: "Dataset_Calibration_TMVA.root"
      cuts: ["energy", "fiducial"]
      # The background in the energy window and the fiducial region too, as the legacy IAXO analysis (by
      # default the cuts select only the reference, the background in the whole readout and at any energy)
      applyCuts: true
      observable: "bdt_score"
      quantiles: [0.2, 1]
