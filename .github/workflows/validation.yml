# Validation of restv2: build, unit tests, restG4 examples and format, at each pull request to master, each
# push to master (merge), each release and by hand. The checks (job names) are required by the protection of
# master (.github/rulesets/master.json, see CONTRIBUTING.md).
#
# The jobs run in the container of the rest-docker repository (ROOT, Geant4, Garfield++, CRY...):
# ghcr.io/<owner of this repository>/rest-env:latest, or the image of the repository variable RESTV2_IMAGE
# (Settings, Secrets and variables, Actions, Variables), e.g. if the owner has uppercase letters or the image
# is published elsewhere.
name: Validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

# A new push to the same pull request (or branch) cancels the validation in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILD_DIR: ${{ github.workspace }}/build
  INSTALL_DIR: ${{ github.workspace }}/install

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RESTV2_IMAGE || format('ghcr.io/{0}/rest-env:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DBUILD_TESTING=ON -DREST_DAQ=ON
          # Every optional part must be enabled in the image
          grep -E "^(REST_G4|REST_CRY|REST_GARFIELD|REST_DAQ):BOOL=ON" "$BUILD_DIR/CMakeCache.txt" | wc -l | grep -qx 4 \
            || { echo "An optional package is disabled:"; grep -E "^REST_(G4|CRY|GARFIELD|DAQ):" "$BUILD_DIR/CMakeCache.txt"; exit 1; }

      # A release: its tag vX.Y.Z (or vX.Y.Z-<suffix>, a pre-release) is the VERSION of project()
      - name: Release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:[A-Z]*=//p' "$BUILD_DIR/CMakeCache.txt")
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-.+)?$ \
                || "${BASH_REMATCH[1]}" != "$version" ]]; then
            echo "The tag $GITHUB_REF_NAME is not v$version (VERSION of project() in CMakeLists.txt)"
            exit 1
          fi

      - name: Build and install
        run: cmake --build "$BUILD_DIR" --target install -j "$(nproc)"

      - name: Executables and libraries
        run: |
          source "$INSTALL_DIR/thisREST.sh"
          restRoot -b -q
          command -v restManager restG4 restGarfield femclient

      - name: Documentation
        run: cmake --build "$BUILD_DIR" --target doc 2>&1 | tee doxygen.log && ! grep -i "error:" doxygen.log

      # The build and install trees for the test jobs (same paths in their containers)
      - name: Pack the build
        run: tar -czf build.tar.gz -C "$GITHUB_WORKSPACE" build install

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tar.gz
          retention-days: 1

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RESTV2_IMAGE || format('ghcr.io/{0}/rest-env:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unpack the build
        run: tar -xzf build.tar.gz -C "$GITHUB_WORKSPACE"

      # A step per component, to see which one fails
      - name: tools
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^tools$' --output-on-failure
      - name: core
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^core$' --output-on-failure
      - name: analysis
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^analysis$' --output-on-failure
      - name: raw
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^raw$' --output-on-failure
      - name: detector
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^detector$' --output-on-failure
      - name: track
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^track$' --output-on-failure
      - name: geant4
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^geant4$' --output-on-failure
      - name: connectors
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^connectors$' --output-on-failure
      - name: pipelines
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^pipelines$' --output-on-failure
      - name: restGarfield
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^restGarfield$' --output-on-failure
      - name: restDAQ
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^restDAQ$' --output-on-failure

  restg4-examples:
    name: restG4 examples
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ vars.RESTV2_IMAGE || format('ghcr.io/{0}/rest-env:latest', github.repository_owner) }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unpack the build
        run: tar -xzf build.tar.gz -C "$GITHUB_WORKSPACE"

      - name: restG4 examples
        run: cd "$BUILD_DIR" && ctest -j "$(nproc)" -L '^restG4$' --output-on-failure

  # Image with restv2 installed (/opt/rest), on the environment image, when the tests pass at each push to
  # master or run by hand on master (tag latest) and each release (its tag): ghcr.io/<owner>/rest. Its
  # Dockerfile is rest/Dockerfile of the rest-docker repository (built with this repository as context). The
  # projects and rest-common-readouts use it to run restv2 without building it. It is pushed only if its
  # version is the commit built, clean, and in a release its tag (CONTRIBUTING.md, Versions and releases)
  image:
    name: Image
    needs: [unit-tests, restg4-examples]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      # All the history and tags: the version of restv2 (git describe)
      - uses: actions/checkout@v7
        with:
          path: rest-framework
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/rest-docker
          path: rest-docker

      # The image name must be lowercase
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rest" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha

      # Built and checked before pushing it (the push reuses the build, cached in the builder)
      - uses: docker/build-push-action@v7
        with:
          context: rest-framework
          file: rest-docker/rest/Dockerfile
          build-args: |
            BASE_IMAGE=${{ vars.RESTV2_IMAGE || format('ghcr.io/{0}/rest-env:latest', github.repository_owner) }}
            JOBS=4
          load: true
          tags: rest:check

      # The version of the code in the image: the commit built, without uncommitted changes and, in a
      # release, its tag (restManager --version: "rest-for-physics-toolkit X.Y.Z (commit <sha>, vX.Y.Z,
      # <date>, clean)")
      - name: Version in the image
        run: |
          summary=$(docker run --rm rest:check restManager --version | grep -m1 '^rest-for-physics-toolkit ')
          echo "$summary"
          [[ "$summary" == *"commit $GITHUB_SHA"* && "$summary" == *", clean)" ]] \
            || { echo "The image is not the clean commit $GITHUB_SHA"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$summary" != *", $GITHUB_REF_NAME, "* ]]; then
            echo "The image is not the release $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: docker/build-push-action@v7
        with:
          context: rest-framework
          file: rest-docker/rest/Dockerfile
          build-args: |
            BASE_IMAGE=${{ vars.RESTV2_IMAGE || format('ghcr.io/{0}/rest-env:latest', github.repository_owner) }}
            JOBS=4
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # macOS: build, install, restRoot and unit tests. Without Geant4, Garfield++, CRY and restDAQ (the DAQ runs
  # on Linux; restG4, restGarfield and restDAQ are checked on Linux). ROOT of the version of the rest-env
  # image (ROOT_VERSION of the rest-docker Dockerfile, to be changed with it): the results of the pipelines
  # depend on the ROOT version (e.g. the TMVA training). From conda-forge, with its compiler and libraries
  # (the binary release of root.cern needs libraries of MacPorts). Not required by the protection of master
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        # Login shell: the conda environment activated in each step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: rest
          create-args: >-
            root=6.36.04 cxx-compiler cmake ninja yaml-cpp gtest
          cache-environment: true

      - name: Configure
        run: |
          root-config --version
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DBUILD_TESTING=ON \
            -DREST_G4=OFF -DREST_GARFIELD=OFF

      - name: Build and install
        run: cmake --build "$BUILD_DIR" --target install -j "$(sysctl -n hw.ncpu)"

      - name: Executables and libraries
        run: |
          source "$INSTALL_DIR/thisREST.sh"
          restRoot -b -q
          command -v restManager

      - name: Unit tests
        run: cd "$BUILD_DIR" && ctest -j "$(sysctl -n hw.ncpu)" --output-on-failure

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
